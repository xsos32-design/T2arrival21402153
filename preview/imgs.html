<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>圖片預覽 · 班機看板</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#0a0614;color:#e8e3f5;font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;font-weight:700;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
.ctl{flex:none;background:#120a1f;border-bottom:1px solid #00f0ff;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.row>b{font-size:12px;color:#9a8fb5;min-width:2.6em;flex:none}
#r1,#r1b{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#r1 button,#r1b button{flex:none}
#r2{margin-left:auto;gap:4px}#r2 button{padding:7px 9px}
button{font:inherit;font-size:14px;font-weight:900;padding:7px 11px;min-height:40px;cursor:pointer;background:#1a1030;border:1px solid #3a2a5a;color:#b9aed6;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
button.on{background:rgba(0,240,255,.16);border-color:#00f0ff;color:#00f0ff;box-shadow:0 0 12px -3px #00f0ff}
.tab.on{background:rgba(255,42,109,.18);border-color:#ff2a6d;color:#ff9ec0}
.bgb{display:flex;align-items:center;gap:5px;padding-left:5px;padding-right:8px}
.bgb i{width:22px;height:34px;flex:none;background:#0a0614 center/cover;border:1px solid #3a2a5a}
.stage{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0614}
#home{position:absolute;inset:0;overflow:auto;padding:16px;display:none}
.phone{max-width:360px;margin:0 auto;padding:22px 16px 28px;border-radius:34px;border:2px solid #3a2a5a;background:radial-gradient(120% 60% at 50% 0,#3b1a6b,#120a1f 70%)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.app{text-align:center;font-size:11.5px;color:#fff}
.app i{display:block;width:62px;height:62px;margin:0 auto 5px;border-radius:15px;background:#2a2340 center/cover;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.app i.x{background:linear-gradient(135deg,#454056,#2a2738)}
.cmp{max-width:360px;margin:16px auto 0;display:flex;gap:16px;justify-content:center}
.cmp div{text-align:center;font-size:12.5px;color:#9a8fb5}
.cmp img{display:block;width:96px;height:96px;border-radius:22px;margin:0 auto 6px;background:#222}
.cap{max-width:360px;margin:14px auto 0;font-size:13px;color:#b9aed6;line-height:1.7}
</style>
</head>

  <div class="row">

    <span class="row" id="r2"><button class="lv" data-l=".82">淡</button><button class="lv on" data-l=".68">中</button><button class="lv" data-l=".5">濃</button></span>

var BG='n_runway', LV='.68', PAGE='board';
document.getElementById('newic').style.backgroundImage='url('+IMG.icon+')';
document.getElementById('newic2').src=IMG.icon;
[].forEach.call(document.querySelectorAll('.bgb'),function(b){ b.querySelector('i').style.backgroundImage='url('+IMG.p[b.dataset.b]+')'; });
function css(){
  if(!BG) return '';
  var ov='linear-gradient(rgba(10,6,20,'+LV+'),rgba(10,6,20,'+LV+'))';
  /* 背景圖固定在畫面後面，往下捲不會跟著跑（iPhone 也一樣）；取代原本的格線 */
  return 'html{background:#0a0614!important} html body{background:transparent!important}'
   +'html body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:'+ov+',url('+IMG.p[BG]+') center/cover no-repeat}'
   +'@media (min-width:821px){html body::before{background:'+ov+',url('+IMG.w[BG]+') center/cover no-repeat}}';
}
function apply(){
  var d; try{ d=document.getElementById('f').contentDocument; }catch(e){ return; } if(!d||!d.head) return;
  var s=d.getElementById('pvcss'); if(!s){ s=d.createElement('style'); s.id='pvcss'; d.head.appendChild(s); }
  s.textContent=css();
}
function paint(){
  [].forEach.call(document.querySelectorAll('.tab'),function(b){ b.classList.toggle('on',b.dataset.p===PAGE); });
  [].forEach.call(document.querySelectorAll('.bg'),function(b){ b.classList.toggle('on',b.dataset.b===BG); });
  [].forEach.call(document.querySelectorAll('.lv'),function(b){ b.classList.toggle('on',b.dataset.l===LV); });
  document.getElementById('r1').style.display=PAGE==='board'?'':'none'; document.getElementById('r1b').style.display=PAGE==='board'?'':'none';
  document.getElementById('r2').style.display=PAGE==='board'&&BG?'':'none';
  document.getElementById('home').style.display=PAGE==='home'?'block':'none';
  document.getElementById('f').style.display=PAGE==='home'?'none':'';
}
document.querySelectorAll('.tab').forEach(function(b){ b.onclick=function(){ PAGE=b.dataset.p; paint(); }; });
document.querySelectorAll('.bg').forEach(function(b){ b.onclick=function(){ BG=b.dataset.b; paint(); apply(); }; });
document.querySelectorAll('.lv').forEach(function(b){ b.onclick=function(){ LV=b.dataset.l; paint(); apply(); }; });
document.getElementById('f').addEventListener('load',function(){ apply(); setTimeout(apply,1500); });
paint();
</script>
