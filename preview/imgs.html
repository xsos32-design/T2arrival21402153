<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>圖片預覽 · 班機看板</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#0a0614;color:#e8e3f5;font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;font-weight:700;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
.ctl{flex:none;background:#120a1f;border-bottom:1px solid #00f0ff;padding:8px 10px calc(8px) ;padding-top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row b{font-size:12px;color:#9a8fb5;align-self:center;min-width:3em}
button{font:inherit;font-size:14px;font-weight:900;padding:8px 11px;min-height:40px;cursor:pointer;background:#1a1030;border:1px solid #3a2a5a;color:#b9aed6;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
button.on{background:rgba(0,240,255,.16);border-color:#00f0ff;color:#00f0ff;box-shadow:0 0 12px -3px #00f0ff}
.tab.on{background:rgba(255,42,109,.18);border-color:#ff2a6d;color:#ff9ec0}
.tip{font-size:12.5px;color:#9a8fb5;line-height:1.5}
.tip b{color:#f5ee0b}
.stage{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0614}
#home{position:absolute;inset:0;overflow:auto;padding:16px;display:none}
.phone{max-width:360px;margin:0 auto;padding:22px 16px 28px;border-radius:34px;border:2px solid #3a2a5a;
  background:radial-gradient(120% 60% at 50% 0,#3b1a6b,#120a1f 70%)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.app{text-align:center;font-size:11.5px;color:#fff;font-weight:700}
.app i{display:block;width:62px;height:62px;margin:0 auto 5px;border-radius:15px;background:#2a2340 center/cover;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.app i.x{background:linear-gradient(135deg,#454056,#2a2738)}
.cap{max-width:360px;margin:14px auto 0;font-size:13px;color:#b9aed6;line-height:1.7}
.cmp{max-width:360px;margin:16px auto 0;display:flex;gap:16px;justify-content:center}
.cmp div{text-align:center;font-size:12.5px;color:#9a8fb5}
.cmp img{display:block;width:96px;height:96px;border-radius:22px;margin:0 auto 6px;background:#222}
</style>
</head>
<body>
<div class="ctl">
  <div class="row"><b>看哪頁</b>
    <button class="tab on" data-p="board">班機看板</button>
    <button class="tab" data-p="log">更新日誌</button>
    <button class="tab" data-p="home">主畫面圖示</button>
  </div>
  <div class="row" id="opts"><b>圖片</b>
    <button class="sw on" data-k="mk">① 浮水印背景</button>
    <button class="sw" data-k="empty">② 沒班機插圖</button>
    <button class="sw on" data-k="banner">③ 日誌橫幅</button>
  </div>
  <div class="tip" id="tip"></div>
</div>
<div class="stage">
  <iframe id="f" src="../index.html"></iframe>
  <div id="home">
    <div class="phone"><div class="grid">
      <div class="app"><i class="x"></i>相機</div><div class="app"><i class="x"></i>照片</div><div class="app"><i class="x"></i>LINE</div><div class="app"><i class="x"></i>天氣</div>
      <div class="app"><i id="newic"></i>班機看板</div><div class="app"><i class="x"></i>時鐘</div><div class="app"><i class="x"></i>地圖</div><div class="app"><i class="x"></i>設定</div>
    </div></div>

  </div>

  mk:'html body .mk{background:linear-gradient(180deg,rgba(10,6,20,0),rgba(10,6,20,.5)),url('+IMG.runway+') center 92%/cover!important}',
  banner:'html body .hd{background:linear-gradient(180deg,rgba(10,6,20,.25),rgba(10,6,20,.88)),url('+IMG.cockpit+') center 55%/cover!important;padding-top:34px!important;padding-bottom:18px!important;border-bottom:2px solid #ff2a6d!important} .hd h1{text-shadow:0 0 14px #00f0ff,0 2px 6px #000}',
  empty:'.empty.pv{padding:0!important;overflow:hidden;background:#120a1f!important;border:1px solid rgba(0,240,255,.4)!important;text-align:center;color:#b9aed6!important;font-size:15px!important}.empty.pv img{display:block;width:100%;height:150px;object-fit:cover;opacity:.85;-webkit-mask:linear-gradient(#000 60%,transparent);mask:linear-gradient(#000 60%,transparent)}.empty.pv span{display:block;padding:4px 12px 16px}'
};
function apply(){
  var f=document.getElementById('f'), d; try{ d=f.contentDocument; }catch(e){ return; } if(!d||!d.head) return;
  var s=d.getElementById('pvcss'); if(!s){ s=d.createElement('style'); s.id='pvcss'; d.head.appendChild(s); }
  s.textContent=(ON.mk?CSS.mk:'')+(ON.banner?CSS.banner:'')+CSS.empty;
  var w=f.contentWindow;
  if(PAGE==='board'&&w.render&&!w.__pv){ w.__pv=1; var _r=w.render; w.render=function(){ var x=_r.apply(this,arguments); try{ fake(); }catch(e){} return x; }; }
  fake();
}
function fake(){
  var d=document.getElementById('f').contentDocument, out=d&&d.getElementById('out'); if(!out) return;
  var old=out.querySelector('.empty.pv');
  if(ON.empty&&PAGE==='board'){ if(!old){ out.setAttribute('data-pvbak',''); out.__bak=out.innerHTML; out.innerHTML='<div class="empty pv"><img src="'+IMG.apron+'" alt=""><span>這個區間沒有符合的班機。</span></div>'; } }
  else if(old&&out.__bak!=null){ out.innerHTML=out.__bak; out.__bak=null; }
}
function paint(){
  [].forEach.call(document.querySelectorAll('.tab'),function(b){ b.classList.toggle('on',b.dataset.p===PAGE); });
  [].forEach.call(document.querySelectorAll('.sw'),function(b){ b.classList.toggle('on',!!ON[b.dataset.k]);
    b.style.display=(PAGE==='board'&&b.dataset.k!=='banner')||(PAGE==='log'&&b.dataset.k==='banner')?'':'none'; });
  document.getElementById('opts').style.display=PAGE==='home'?'none':'';
  document.getElementById('tip').innerHTML=TIPS[PAGE];
  document.getElementById('home').style.display=PAGE==='home'?'block':'none';
  document.getElementById('f').style.display=PAGE==='home'?'none':'';
}
document.querySelectorAll('.tab').forEach(function(b){ b.onclick=function(){
  var p=b.dataset.p; if(p===PAGE) return; PAGE=p; var f=document.getElementById('f');
  if(p==='board'&&!/index\.html/.test(f.src)) f.src='../index.html';
  if(p==='log'&&!/changelog/.test(f.src)) f.src='../changelog.html';
  paint(); }; });
document.querySelectorAll('.sw').forEach(function(b){ b.onclick=function(){ ON[b.dataset.k]=!ON[b.dataset.k]; paint(); apply(); }; });
document.getElementById('f').addEventListener('load',function(){ apply(); setTimeout(apply,1500); setTimeout(apply,5000); });
paint();
</script>
</body>
</html>
