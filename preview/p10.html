pP7 body:not(#_) #ctl #cpM{min-height:36px!important;font-size:13px!important;font-weight:800!important;opacity:.85}',\n  'html.pP7 body:not(#_) #ctl .chiplabel,html.pP7 body:not(#_) #ctl .v2lab{font-size:11.5px!important;opacity:.8}',\n  /* P8 時段 ◀ ▶ */\n  '#ctlbar .p8nav{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:42px;height:40px;margin:0;font-size:17px;font-weight:900;cursor:pointer;color:#00E5FF;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.5);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}',\n  '#ctlbar .p8nav:active{background:rgba(0,229,255,.3)}',\n  /* P9 回報鍵依時間 */\n  'html.pP9 body:not(#_) #ctl .chip.p9early{opacity:.45!important;filter:saturate(.3)}',\n  'html.pP9 body:not(#_) #ctl .chip.p9early::after{content:\"22:30 後\";display:block;font-size:10.5px;font-weight:800;margin-top:1px;opacity:.9}',\n  'html.pP9 body:not(#_) #ctl .chip.p9early{flex-direction:column!important}',\n  /* P10 星號關注 */\n  'html.pP10 body:not(#_) #out .r.p10pin{outline:2px solid #FFD84A!important;outline-offset:-2px}',\n  'html.pP10 body:not(#_) #out .r.p10pin .c-fno b::before{content:\"★ \";color:#FFD84A}',\n  'html.pP10 body:not(#_) #out .r.p10hold{transform:scale(.985);transition:transform .2s}',\n  '#p10box{margin:0 0 10px;display:grid;gap:6px}',\n  '#p10box .h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:900;letter-spacing:.1em;color:#FFD84A}',\n  '#p10box .h i{font-style:normal;letter-spacing:0;color:#9a8fb5;font-weight:800}',\n  '#p10box .it{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px 12px;background:rgba(255,216,74,.08);border:1px solid rgba(255,216,74,.45);cursor:pointer;font:inherit;color:#e8e3f5;text-align:left;width:100%;margin:0}',\n  '#p10box .it b{font-size:22px;color:#FFD84A} #p10box .it .f{font-size:16px;font-weight:900} #p10box .it .s{display:block;font-size:12.5px;color:#b9c2cf;font-weight:800}
