<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手錶時鐘 · 兩種放法</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#05070a;color:#E8EDF3;
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
 font-size:16px;font-weight:600;line-height:1.5;padding:14px 12px 40px}
.wrap{max-width:820px;margin:0 auto}
h1{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.16em;color:#00EFD4;
 text-transform:uppercase;margin:0 0 4px}
.lead{font-size:13.5px;color:#8b94a1;line-height:1.8;margin:0 0 18px}
.lead b{color:#cfd6e0}
.row{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.col{flex:0 0 auto;width:214px}
.cap{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;letter-spacing:.08em;color:#6b7686;
 text-align:center;margin-bottom:8px;line-height:1.6;min-height:46px}
.cap b{display:block;font-size:15px;color:#FFC53D;letter-spacing:.06em;margin-bottom:3px}
.cap b.on{color:#00EFD4}
.screen{width:198px;height:242px;margin:0 auto;overflow:hidden;position:relative;
 background:#05070a;border:1px solid #2a3545;border-radius:30px;padding:4px 3px}
.note{font-size:12.5px;color:#8b94a1;text-align:center;margin-top:9px;line-height:1.7}
.note b{color:#00EFD4;font-family:ui-monospace,Menlo,monospace}
.note b.warn{color:#FF7A95}

/* 班機卡（跟線上一樣的 E 版型） */
.r{display:flex;flex-wrap:wrap;align-items:center;gap:1px 5px;padding:4px 6px 4px 10px;
 margin-bottom:4px;position:relative;overflow:hidden;background:#0B1019;border:1px solid #1b2431}
.r::after{content:"";position:absolute;width:16px;height:16px;right:-8px;top:-8px;
 background:#05070a;transform:rotate(45deg);border-bottom:1px solid #2a3545}
.r.r40{background:#064F47;border-color:#00EFD4;box-shadow:inset 5px 0 0 #00EFD4}
.r.r53{background:#6B0F33;border-color:#FF2E6E;box-shadow:inset 5px 0 0 #FF2E6E}
.r.r40::after{border-bottom-color:#00EFD4} .r.r53::after{border-bottom-color:#FF2E6E}
.r:not(.r40):not(.r53){box-shadow:inset 5px 0 0 #2a3545}
b.t{order:1;font-family:ui-monospace,Menlo,monospace;color:#FFC53D;font-weight:800;
 font-size:24px;line-height:1;letter-spacing:-.05em;flex:0 0 auto}
.f{order:2;font-family:ui-monospace,Menlo,monospace;color:#fff;font-weight:800;font-size:29px;
 line-height:1;letter-spacing:-.055em;flex:0 0 auto;margin-left:auto}
.brk{order:3;flex:1 0 100%;height:0}
.g{order:4;font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;line-height:1;flex:0 0 auto}
.g b{display:inline-block;padding:0 5px;background:#161e29;border:1px solid #2a3545;color:#c6d1de}
.r40 .g b{background:#00EFD4;border-color:#00EFD4;color:#02241F}
.r53 .g b{background:#FF2E6E;border-color:#FF2E6E;color:#2B0411}
.c{order:5;display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 0;font-size:12px;color:#8d99a9}
.r40 .c,.r53 .c{color:#DCE4EC}
.cn{font-style:normal;flex:1 1 auto;min-width:2.8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px{font-style:normal;flex:0 0 auto;font-size:11px;padding:0 2px;border:1px solid;font-weight:900;letter-spacing:-.05em}
.px u{text-decoration:none;font-size:9px;opacity:.8}
.p2{border-color:#7a5c12;color:#FFC53D;background:rgba(255,197,61,.08)}
.p3{border-color:#8a2a3f;color:#FF7A95;background:rgba(255,46,110,.09)}
.r40 .px,.r53 .px{background:rgba(0,0,0,.45)}
.st{order:6;flex:0 0 auto;margin-left:auto;font-size:11.5px;font-weight:900;padding:1px 3px;border:1px solid}
.b-ok{border-color:#1e6b4d;color:#49E3A3;background:rgba(73,227,163,.08)}
.b-warn{border-color:#7a5c12;color:#FFC53D;background:rgba(255,197,61,.08)}

/* 浮動鍵 */
.fab{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:4px;z-index:5}
.fabb{flex:1 1 0;min-width:0;min-height:46px;display:flex;align-items:center;justify-content:center;
 font-size:17px;font-weight:900;letter-spacing:-.04em;white-space:nowrap;
 background:rgba(17,21,28,.96);border:1px solid #2A323E;color:#C3CAD4;box-shadow:0 4px 14px rgba(0,0,0,.55)}
.clk{font-family:ui-monospace,Menlo,monospace;background:rgba(0,239,212,.12);border-color:#00EFD4;
 color:#4DF6E2;letter-spacing:-.04em}
/* 甲：四格一排 */
.vA .clk{flex:1.45 1 0;font-size:18px}
/* 乙：時鐘自己一條，按鍵維持大 */
.vB .fab{flex-direction:column;gap:4px}
.vB .clkbar{min-height:28px;display:flex;align-items:center;justify-content:center;
 font-family:ui-monospace,Menlo,monospace;font-size:21px;font-weight:900;letter-spacing:.02em;
 background:rgba(0,239,212,.12);border:1px solid #00EFD4;color:#4DF6E2;box-shadow:0 4px 14px rgba(0,0,0,.55)}
.vB .btns{display:flex;gap:4px}
.vB .btns .fabb{flex:1 1 0}
.padA{height:54px} .padB{height:92px}
@media (max-width:700px){ .col{width:100%;max-width:250px} }
@media (max-width:340px){
  body{padding:6px 5px 24px;font-size:14px}
  h1{font-size:12.5px} .lead{font-size:12px;margin-bottom:12px}
  .col{width:100%;max-width:none} .row{gap:16px}
  .screen{width:100%;border-radius:16px} .cap{min-height:0}
}
</style>
</head>
<body>
<div class="wrap">
<h1>手錶時鐘 · 兩種放法</h1>
<p class="lead">框框是 45mm Apple Watch 的實際大小（198 × 242）。時鐘是<b>真的在走</b>——
整分鐘才更新一次，不耗電也不會卡捲動。</p>
<div class="row" id="row"></div>
</div>
<script>
var FL=[
 {t:'19:05',f:'BR0028',g:'C5',c:'東京成田',px:235,lv:2,sh:'r40',st:'延遲',sc:'b-warn'},
 {t:'19:14',f:'JX0025',g:'A8',c:'鳳凰城',px:260,lv:3,sh:'r53',st:'準時',sc:'b-ok'},
 {t:'19:28',f:'CI0152',g:'B3',c:'大阪關西',px:205,lv:2,sh:'',st:'提早',sc:'b-ok'}
];
function card(x){
  return '<div class="r '+x.sh+'"><b class="t">'+x.t+'</b><span class="f">'+x.f+'</span>'
   +'<span class="brk"></span><span class="g"><b>'+x.g+'</b></span>'
   +'<span class="c"><i class="cn">'+x.c+'</i><i class="px p'+x.lv+'">'+x.px+'<u>入境</u></i></span>'
   +'<span class="st '+x.sc+'">'+x.st+'</span></div>';
}
var OPT=[
 {k:'甲',v:'A',name:'四格一排',desc:'時鐘和三顆鍵排同一列。<br>不多占高度，但鍵會變窄。',
  fab:'<div class="fab"><span class="fabb clk" id="k0">--:--</span>'
     +'<span class="fabb">↑</span><span class="fabb">6H</span><span class="fabb">↻</span></div>'},
 {k:'乙',v:'B',name:'時鐘自己一條',desc:'時鐘橫跨整排放上面，<br>三顆鍵維持現在的寬度。',
  fab:'<div class="fab"><span class="clkbar" id="k1">--:--</span>'
     +'<div class="btns"><span class="fabb">↑</span><span class="fabb">6H</span><span class="fabb">↻</span></div></div>'}
];
document.getElementById('row').innerHTML=OPT.map(function(o,i){
  return '<div class="col"><div class="cap"><b class="'+(i===1?'on':'')+'">'+o.k+'　'+o.name+'</b>'+o.desc+'</div>'
   +'<div class="screen v'+o.v+'" id="s'+i+'">'+FL.map(card).join('')
   +'<div class="pad'+o.v+'"></div>'+o.fab+'</div>'
   +'<div class="note" id="n'+i+'"></div></div>';
}).join('');
OPT.forEach(function(o,i){
  var box=document.getElementById('s'+i);
  var fab=box.querySelector('.fab');
  var fh=Math.round(fab.getBoundingClientRect().height)+4;
  var r=box.querySelector('.r').getBoundingClientRect().height+4;
  var usable=242-fh;
  var bw=Math.round(box.querySelectorAll('.fabb')[o.v==='A'?1:0].getBoundingClientRect().width);
  document.getElementById('n'+i).innerHTML='鍵寬 <b'+(bw<44?' class="warn"':'')+'>'+bw+'px</b>'
   +'　·　浮動區高 <b>'+fh+'px</b><br>剩下看得到 <b>'+(usable/r).toFixed(1)+'</b> 班';
});
/* 整分鐘才跳一次：一分鐘寫一次字，不可能卡捲動。頁面關起來就停。 */
function tick(){
  var d=new Date();
  var s=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  var a=document.getElementById('k0'), b=document.getElementById('k1');
  if(a) a.textContent=s; if(b) b.textContent=s;
  var ms=(60-d.getSeconds())*1000 - d.getMilliseconds() + 50;
  clearTimeout(tick._t); tick._t=setTimeout(tick, ms);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden) clearTimeout(tick._t); else tick();
});
tick();
</script>
</body>
</html>
