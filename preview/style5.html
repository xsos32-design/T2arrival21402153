<title>全站美術預覽 · 班機看板</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#0a0614;color:#e8e3f5;font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;font-weight:700;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
.ctl{flex:none;background:#120a1f;border-bottom:1px solid #00f0ff;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px}
.row{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.row>b{flex:none;font-size:12px;color:#9a8fb5;min-width:3.4em}
.ttl{font-size:13px;color:#f5ee0b;font-weight:900;white-space:nowrap}
.ttl a{color:#9a8fb5;font-size:12px;margin-left:8px}
.tip{font-size:12px;color:#b9aed6;line-height:1.5}
button{flex:none;font:inherit;font-size:13.5px;font-weight:900;padding:6px 10px;min-height:38px;cursor:pointer;background:#1a1030;border:1px solid #3a2a5a;color:#8a7fa8;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
button.on{background:rgba(0,240,255,.16);border-color:#00f0ff;color:#00f0ff}
button.pg.on{background:rgba(255,42,109,.18);border-color:#ff2a6d;color:#ff9ec0}
.stage{flex:1;min-height:0;position:relative;overflow:auto}
#f{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0614}
#f.watch{position:relative;inset:auto;width:200px;height:240px;margin:24px auto 0;display:block;border:6px solid #222;border-radius:34px;transform:scale(1.45);transform-origin:top center;background:#000}
#home{display:none;padding:16px}
.phone{max-width:360px;margin:0 auto;padding:22px 16px 28px;border-radius:34px;border:2px solid #3a2a5a;background:radial-gradient(120% 60% at 50% 0,#3b1a6b,#120a1f 70%)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.app{text-align:center;font-size:11.5px;color:#fff}
.app i{display:block;width:62px;height:62px;margin:0 auto 5px;border-radius:15px;background:#2a2340 center/cover;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.app i.x{background:linear-gradient(135deg,#454056,#2a2738)}
.cmp{max-width:360px;margin:16px auto 0;display:flex;gap:16px;justify-content:center}
.cmp div{text-align:center;font-size:12.5px;color:#9a8fb5}
.cmp img{display:block;width:96px;height:96px;border-radius:22px;margin:0 auto 6px;background:#222}
</style>
</head>
