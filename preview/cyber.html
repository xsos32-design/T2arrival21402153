<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>賽博版樣子 · 班機看板</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#05070a;color:#e5e9ef;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
  font-size:16px;line-height:1.45;font-weight:600;-webkit-text-size-adjust:100%}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

/* ───────── 控制列 ───────── */
.ctl{position:sticky;top:0;z-index:50;background:#0a0d12;border-bottom:1px solid #1b2230;
  padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl b{font-size:12px;color:#6b7686;font-weight:800;letter-spacing:.08em;margin-right:2px}
.sw{font:inherit;font-size:13.5px;font-weight:800;padding:8px 12px;border-radius:10px;cursor:pointer;
  background:#11151c;border:1px solid #262d3a;color:#8b94a1;min-height:42px}
.sw.on{background:#15304a;border-color:#3b82f6;color:#bfdbfe}
.sun.on{background:#4a3a10;border-color:#d9a441;color:#f5d98a}
.note{max-width:960px;margin:14px auto 0;padding:0 12px;font-size:13px;color:#8b94a1;line-height:1.75}
.note b{color:#cfd6e0}
.wrap{max-width:960px;margin:0 auto;padding:14px 12px 40px}

/* ───────── 共用卡片骨架 ───────── */
.r{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) 78px;gap:2px 9px;
  grid-template-areas:"time fno gate" "shop city st";align-items:center;
  padding:8px 10px 8px 13px;margin-bottom:7px;position:relative;overflow:hidden}
.c-time{grid-area:time} .c-fno{grid-area:fno;text-align:center}
.c-gate{grid-area:gate;text-align:right;white-space:nowrap}
.c-shop{grid-area:shop} .c-city{grid-area:city} .c-st{grid-area:st;justify-self:end}
.c-time b{display:block;font-size:31px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.c-time i{display:block;font-style:normal;font-size:13px;font-weight:700;margin-top:1px;color:#8b94a1}
.c-fno b{font-size:27px;font-weight:800;letter-spacing:-.02em}
.cty{font-style:normal;font-size:20px;font-weight:800;margin-left:8px;vertical-align:-2px}
.c-gate b{font-size:33px;font-weight:900;display:inline-block;padding:0 6px;border-radius:9px;line-height:1.05}
.c-city{font-size:15.5px;font-weight:650;color:#98a2b0;line-height:1.35}
.tag,.badge{display:inline-block;font-size:13px;font-weight:800;padding:3px 8px;border-radius:7px;white-space:nowrap}
.px,.tx{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 7px;border-radius:7px;margin-left:5px}
.px u,.tx u{text-decoration:none;font-size:10.5px;opacity:.72;margin-left:2px}

/* ═════════ A：現在這一版 ═════════ */
.v-now .r{background:#11151C;border:1px solid #1E242E;border-radius:12px}
.v-now .r.r40{background:#0E5049;border-color:#2A9A90;box-shadow:inset 7px 0 0 #3DE0D5,0 4px 22px -10px rgba(61,224,213,.9)}
.v-now .r.r53{background:#7A2440;border-color:#B83E5C;box-shadow:inset 7px 0 0 #F2506E,0 4px 22px -10px rgba(242,80,110,.9)}
.v-now .r.plain{background:#0C1016;border-color:#1A1F27}
.v-now .c-time b{color:#E7C785} .v-now .t-late{color:#E2A85C} .v-now .t-early{color:#8FC4D6}
.v-now .c-fno b{color:#fff} .v-now .c-gate b{background:#2b313b;color:#e5e9ef}
.v-now .r40 .c-gate b{background:#3DE0D5;color:#042321} .v-now .r53 .c-gate b{background:#F2506E;color:#2B0710}
.v-now .r40 .tag{background:#3DE0D5;color:#042321} .v-now .r53 .tag{background:#F2506E;color:#2B0710}
.v-now .plain .tag{background:#232830;color:#9aa3b0}
.v-now .px{background:#1E242E;color:#C3CAD4} .v-now .p2{background:#3A2B0C;color:#F0C167}
.v-now .p3{background:#3E1712;color:#F49B8D} .v-now .p1{background:#14352C;color:#79D8B0}
.v-now .tx{background:#2A2216;color:#DFC079}
.v-now .b-ok{background:#14352C;color:#79D8B0} .v-now .b-warn{background:#3A2B0C;color:#F0C167}
.v-now .b-bad{background:#3E1712;color:#F49B8D} .v-now .b-none{background:#1E242E;color:#8B93A1}
.v-now .r.soon{box-shadow:inset 7px 0 0 #D9A441,0 0 0 3px #D9A441,0 0 30px 2px rgba(217,164,65,.6)}
.v-now .r.done{opacity:.45}
.v-now .hdr{background:#0a0d12;border:1px solid #1E242E;border-radius:12px;padding:11px 13px;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800}
.v-now .hdr span{margin-left:auto;font-size:12px;color:#8b94a1;font-weight:700}

/* ═════════ B/C 共用：賽博底 ═════════ */
.cy{--c40:#00EFD4;--c53:#FF2E6E;--gold:#FFC53D;--dim:#5d6a7d;position:relative}
.cy .wrapbg{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(transparent 0 97%,rgba(0,239,212,.055) 97% 100%) 0 0/100% 34px,
    linear-gradient(90deg,transparent 0 97%,rgba(0,239,212,.055) 97% 100%) 0 0/34px 100%;
  mask-image:radial-gradient(120% 70% at 50% 0,#000 20%,transparent 85%)}
/* HUD 標題列 */
.cy .hdr{position:relative;background:linear-gradient(180deg,#0a1016,#070b10);
  border:1px solid rgba(0,239,212,.3);padding:10px 13px;margin-bottom:13px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;letter-spacing:.14em;
  color:var(--c40);text-transform:uppercase}
.cy .hdr .t{font-size:15px;letter-spacing:.2em}
.cy .hdr .sep{color:rgba(0,239,212,.4)}
.cy .hdr .r8{margin-left:auto;color:#7b8798;letter-spacing:.1em;font-size:11.5px;display:flex;align-items:center;gap:7px}
.cy .hdr .led{width:7px;height:7px;background:var(--c40);box-shadow:0 0 10px var(--c40);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:blip 1.6s steps(1) infinite}
@keyframes blip{0%,60%{opacity:1}61%,100%{opacity:.25}}

/* 卡片：切角 HUD 面板 + 角標 */
.cy .r{background:rgba(9,13,19,.9);border:1px solid #1b2431;border-radius:0;
  clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px))}
.cy .r::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#222c3a}
.cy .r.r40{background:linear-gradient(100deg,rgba(0,239,212,.17),rgba(0,239,212,.03) 55%,transparent);
  border-color:rgba(0,239,212,.5)}
.cy .r.r40::before{background:var(--c40);box-shadow:0 0 14px 1px var(--c40)}
.cy .r.r53{background:linear-gradient(100deg,rgba(255,46,110,.17),rgba(255,46,110,.03) 55%,transparent);
  border-color:rgba(255,46,110,.5)}
.cy .r.r53::before{background:var(--c53);box-shadow:0 0 14px 1px var(--c53)}
.cy .r.plain{background:rgba(7,10,15,.9);border-color:#161d28}
.cy .r.done{opacity:.4}
/* 角標 */
.cy .r .cor{position:absolute;right:0;top:0;width:13px;height:13px;
  border-top:1px solid currentColor;opacity:.55;color:#2f3b4c}
.cy .r40 .cor{color:var(--c40)} .cy .r53 .cor{color:var(--c53)}

.cy .c-time b{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color:var(--gold);letter-spacing:-.02em;font-size:30px;font-weight:700}
.cy .t-late{color:#FF8A3D} .cy .t-early{color:#5BD6FF} .cy .t-same{color:#5BE8A8}
.cy .c-time i{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6b7686;letter-spacing:.02em}
.cy .c-fno b{font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#fff;font-size:25px;letter-spacing:.02em}
.cy .c-gate b{font-family:ui-monospace,Menlo,monospace;background:#161e29;color:#c6d1de;
  border:1px solid #2a3545;border-radius:0;padding:0 7px;font-size:30px}
.cy .r40 .c-gate b{background:rgba(0,239,212,.14);border-color:var(--c40);color:var(--c40);
  text-shadow:0 0 12px rgba(0,239,212,.75)}
.cy .r53 .c-gate b{background:rgba(255,46,110,.14);border-color:var(--c53);color:var(--c53);
  text-shadow:0 0 12px rgba(255,46,110,.75)}
.cy .c-city{color:#8d99a9}
.cy .tag,.cy .badge,.cy .px,.cy .tx{border-radius:0;font-family:ui-monospace,Menlo,monospace;
  letter-spacing:.03em;border:1px solid}
.cy .tag{background:rgba(255,255,255,.03);border-color:#2a3545;color:#93a0b1}
.cy .r40 .tag{background:rgba(0,239,212,.13);border-color:var(--c40);color:var(--c40)}
.cy .r53 .tag{background:rgba(255,46,110,.13);border-color:var(--c53);color:var(--c53)}
.cy .px{background:rgba(255,255,255,.03);border-color:#2a3545;color:#aab6c4}
.cy .p1{border-color:#1e6b4d;color:#49E3A3;background:rgba(73,227,163,.08)}
.cy .p2{border-color:#7a5c12;color:var(--gold);background:rgba(255,197,61,.08)}
.cy .p3{border-color:#8a2a3f;color:#FF7A95;background:rgba(255,46,110,.09)}
.cy .tx{border-color:#5c4a1c;color:#D9B96C;background:rgba(217,185,108,.06)}
.cy .b-ok{border-color:#1e6b4d;color:#49E3A3;background:rgba(73,227,163,.08)}
.cy .b-warn{border-color:#7a5c12;color:var(--gold);background:rgba(255,197,61,.08)}
.cy .b-bad{border-color:#8a2a3f;color:#FF7A95;background:rgba(255,46,110,.09)}
.cy .b-none{border-color:#2a3545;color:#8b94a1;background:rgba(255,255,255,.03)}
/* 即將抵達：掃描線掠過 */
.cy .r.soon{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 26px -6px rgba(255,197,61,.85)}
.cy .r.soon::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(255,197,61,.22) 50%,transparent 65%);
  background-size:260% 100%;animation:sweep 2.6s linear infinite}
@keyframes sweep{0%{background-position:160% 0}100%{background-position:-60% 0}}

/* ═════════ B2：整張用分點色實心填滿（不漸層、不透明）═════════ */
.v-solid .r.r40{background:#064F47;border-color:#00EFD4}
.v-solid .r.r53{background:#6B0F33;border-color:#FF2E6E}
.v-solid .r.plain{background:#0B1019;border-color:#1b2431}
.v-solid .r40 .c-city,.v-solid .r53 .c-city{color:#D6DFE8}
.v-solid .r40 .c-time i,.v-solid .r53 .c-time i{color:#9FB0BE}
/* 底色變實心後，標籤／人數框原本的半透明底會糊掉，改成實色小塊 */
.v-solid .r40 .tag{background:#00EFD4;border-color:#00EFD4;color:#02241F}
.v-solid .r53 .tag{background:#FF2E6E;border-color:#FF2E6E;color:#2B0411}
.v-solid .r40 .c-gate b{background:#00EFD4;border-color:#00EFD4;color:#02241F;text-shadow:none;
  box-shadow:0 0 18px -3px rgba(0,239,212,.95)}
.v-solid .r53 .c-gate b{background:#FF2E6E;border-color:#FF2E6E;color:#2B0411;text-shadow:none;
  box-shadow:0 0 18px -3px rgba(255,46,110,.95)}
.v-solid .r40 .px,.v-solid .r40 .tx,.v-solid .r40 .badge,
.v-solid .r53 .px,.v-solid .r53 .tx,.v-solid .r53 .badge{background:rgba(0,0,0,.42)}
/* 即將抵達的金框不能被實心底吃掉 */
.v-solid .r.soon{border-color:#FFC53D;box-shadow:0 0 0 2px #FFC53D,0 0 26px -6px rgba(255,197,61,.9)}

/* ═════════ B3：B2 再把字推到滿版、全部加粗 ═════════ */
.v-max .r{padding:5px 7px 5px 11px;gap:1px 7px;margin-bottom:6px}
.v-max .r::before{width:6px}
.v-max .c-time b{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1}
.v-max .c-time i{font-size:14px;font-weight:800;margin-top:0;letter-spacing:-.02em}
.v-max .c-fno b{font-size:34px;font-weight:800;letter-spacing:-.05em}
.v-max .cty{font-size:25px;margin-left:5px;vertical-align:-3px}
.v-max .c-gate b{font-size:40px;font-weight:800;padding:0 5px;letter-spacing:-.05em;line-height:1.02}
.v-max .c-city{font-size:20px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.v-max .tag{font-size:17px;font-weight:900;padding:2px 8px;letter-spacing:0}
.v-max .badge{font-size:16.5px;font-weight:900;padding:2px 6px;letter-spacing:-.02em}
.v-max .px,.v-max .tx{font-size:15px;font-weight:900;padding:1px 5px;margin-left:3px;letter-spacing:-.03em}
.v-max .px u,.v-max .tx u{font-size:12px;opacity:.8;margin-left:1px}
/* 字放大後欄寬要重分：登機門給足，中間欄吃剩下的 */
.v-max .r{grid-template-columns:minmax(0,auto) minmax(0,1fr) 78px}
@media (max-width:400px){
  .v-max .c-time b{font-size:35px} .v-max .c-fno b{font-size:30px}
  .v-max .c-gate b{font-size:35px} .v-max .c-city{font-size:18px}
  .v-max .r{grid-template-columns:minmax(0,auto) minmax(0,1fr) 74px}
}

/* ═════════ D：賽博龐克面板（整組機殼）═════════ */
.v-panel{--y:#FCEE09;--c40:#00EFD4;--c53:#FF2E6E}
.v-panel .wrapbg{background:
   radial-gradient(90% 55% at 50% -5%,rgba(252,238,9,.07),transparent 70%),
   linear-gradient(transparent 0 97%,rgba(252,238,9,.05) 97% 100%) 0 0/100% 30px,
   linear-gradient(90deg,transparent 0 97%,rgba(252,238,9,.05) 97% 100%) 0 0/30px 100%;
  mask-image:none}
/* 機殼 */
.pnl{position:relative;border:1px solid rgba(252,238,9,.42);background:rgba(5,7,10,.78);
  padding:0 0 0 19px;margin-bottom:10px;
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% calc(100% - 8px),calc(100% - 8px) 100%,
    20px 100%,0 calc(100% - 20px))}
/* 左側導軌：刻度 */
.pnl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:19px;
  border-right:1px solid rgba(252,238,9,.3);
  background:repeating-linear-gradient(180deg,rgba(252,238,9,.55) 0 1px,transparent 1px 11px) 7px 0/7px 100% no-repeat}
/* 右上角切角補一條亮邊 */
.pnl::after{content:"";position:absolute;right:-1px;top:-1px;width:29px;height:29px;
  border-top:1px solid var(--y);transform:rotate(45deg);transform-origin:top right;opacity:.75}

/* 標題板 */
.plate{display:flex;align-items:center;gap:9px;padding:8px 12px 8px 10px;margin-right:0;
  border-bottom:1px solid rgba(252,238,9,.3);background:linear-gradient(90deg,rgba(252,238,9,.1),transparent 60%);
  font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--y)}
.plate .big{font-size:15px;letter-spacing:.24em}
.plate .hz{flex:1;height:11px;min-width:24px;
  background:repeating-linear-gradient(135deg,rgba(252,238,9,.85) 0 5px,transparent 5px 11px)}
.plate .rec{display:flex;align-items:center;gap:6px;color:#FF2E6E;font-size:11px;letter-spacing:.12em}
.plate .rec i{width:7px;height:7px;border-radius:50%;background:#FF2E6E;box-shadow:0 0 9px #FF2E6E;
  animation:rec 1.3s steps(1) infinite}
@keyframes rec{0%,55%{opacity:1}56%,100%{opacity:.15}}
/* 次標籤列 */
.subbar{display:flex;gap:14px;flex-wrap:wrap;padding:5px 12px 6px 10px;
  border-bottom:1px solid rgba(252,238,9,.16);
  font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.1em;color:#6f7c62}
.subbar b{color:#B9AC3E;font-weight:800}

.v-panel .rows{padding:8px 7px 3px 6px}
.v-panel .r{margin-bottom:7px;padding-left:11px;border:1px solid #1b2431;background:#0B1019;
  clip-path:polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,11px 100%,0 calc(100% - 11px))}
.v-panel .r::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#2a3545}
.v-panel .r.r40{background:#064F47;border-color:var(--c40)}
.v-panel .r.r40::before{background:var(--c40);box-shadow:0 0 16px 1px var(--c40)}
.v-panel .r.r53{background:#6B0F33;border-color:var(--c53)}
.v-panel .r.r53::before{background:var(--c53);box-shadow:0 0 16px 1px var(--c53)}
.v-panel .r.plain{background:#0B1019;border-color:#1b2431}
.v-panel .r .cor{display:none}
.v-panel .r40 .c-city,.v-panel .r53 .c-city{color:#D6DFE8}
.v-panel .r40 .c-time i,.v-panel .r53 .c-time i{color:#9FB0BE}
.v-panel .r40 .tag{background:var(--c40);border-color:var(--c40);color:#02241F}
.v-panel .r53 .tag{background:var(--c53);border-color:var(--c53);color:#2B0411}
.v-panel .r40 .c-gate b{background:var(--c40);border-color:var(--c40);color:#02241F;text-shadow:none;
  box-shadow:0 0 18px -3px rgba(0,239,212,.95)}
.v-panel .r53 .c-gate b{background:var(--c53);border-color:var(--c53);color:#2B0411;text-shadow:none;
  box-shadow:0 0 18px -3px rgba(255,46,110,.95)}
.v-panel .r40 .px,.v-panel .r40 .tx,.v-panel .r40 .badge,
.v-panel .r53 .px,.v-panel .r53 .tx,.v-panel .r53 .badge{background:rgba(0,0,0,.45)}
/* 狀態用中括號包起來 */
.v-panel .badge::before{content:"[ "} .v-panel .badge::after{content:" ]"}
.v-panel .r.soon{border-color:var(--y);box-shadow:0 0 0 2px var(--y),0 0 26px -6px rgba(252,238,9,.9)}
.v-panel .r.soon::after{background:linear-gradient(100deg,transparent 35%,rgba(252,238,9,.22) 50%,transparent 65%);
  background-size:260% 100%}
.v-panel .r{grid-template-columns:minmax(0,auto) minmax(0,1fr) 70px}
.v-panel .px,.v-panel .tx{font-size:11.5px;padding:2px 5px;margin-left:4px}
.v-panel .c-city{font-size:15px}
.v-panel .c-time b{color:var(--y)}
.v-panel .t-late{color:#FF8A3D} .v-panel .t-early{color:#5BD6FF} .v-panel .t-same{color:#5BE8A8}

/* 機殼頁尾 */
.foot{display:flex;align-items:center;gap:10px;padding:7px 12px 8px 10px;
  border-top:1px solid rgba(252,238,9,.22);
  font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;color:#6f7c62}
.foot .seg{flex:1;height:7px;min-width:30px;
  background:repeating-linear-gradient(90deg,rgba(252,238,9,.5) 0 7px,transparent 7px 11px)}
.foot b{color:var(--y);font-weight:800}

/* ═════════ C：重口味加料 ═════════ */
.v-hard .wrapbg{background-image:
    repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px),
    linear-gradient(transparent 0 97%,rgba(0,239,212,.07) 97% 100%),
    linear-gradient(90deg,transparent 0 97%,rgba(0,239,212,.07) 97% 100%);
  background-size:100% 3px,100% 34px,34px 100%;mask-image:none;opacity:.9}
.v-hard .c-time b{text-shadow:0 0 16px rgba(255,197,61,.85),2px 0 0 rgba(255,46,110,.5),-2px 0 0 rgba(0,239,212,.5)}
.v-hard .c-fno b{text-shadow:0 0 14px rgba(255,255,255,.6),1.5px 0 0 rgba(255,46,110,.45),-1.5px 0 0 rgba(0,239,212,.45)}
.v-hard .hdr .t{animation:glitch 4.5s steps(1) infinite}
@keyframes glitch{0%,92%{transform:none;opacity:1}93%{transform:translateX(-2px);opacity:.75}
  94%{transform:translateX(2px)}95%{transform:none}96%{transform:translateX(1px);opacity:.85}97%,100%{transform:none;opacity:1}}
.v-hard .r.soon{animation:hardpulse 1.5s ease-in-out infinite}
@keyframes hardpulse{0%,100%{box-shadow:0 0 0 1px var(--gold),0 0 18px -8px rgba(255,197,61,.7)}
  50%{box-shadow:0 0 0 2px var(--gold),0 0 42px 0 rgba(255,197,61,1)}}
.v-hard .r40{box-shadow:0 0 30px -14px var(--c40)} .v-hard .r53{box-shadow:0 0 30px -14px var(--c53)}
/* CRT 掃描線疊在最上層（卡片也會被蓋到，才看得出來） */
.v-hard::after{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.42) 0 1px,transparent 1px 3px);
  animation:roll 7s linear infinite}
@keyframes roll{0%{background-position-y:0}100%{background-position-y:3px}}

/* 模擬太陽下（整層洗白，看對比還撐不撐得住） */
.sunon .wrap::after{content:"";position:fixed;inset:0;background:rgba(236,242,250,.52);pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:360px){
  .r{grid-template-columns:minmax(0,auto) minmax(0,1fr) 68px;
     grid-template-areas:"time time gate" "fno fno fno" "city city city" "shop shop st"}
  .c-time b{font-size:28px} .c-fno b{font-size:24px} .c-gate b{font-size:27px}
}
</style>
</head>
<body>

<div class="ctl">
  <b>樣式</b>
  <button class="sw on" data-v="now">A 現在這版</button>
  <button class="sw" data-v="soft">B 賽博·剛好</button>
  <button class="sw" data-v="solid">B2 賽博·實心填滿</button>
  <button class="sw" data-v="hard">C 賽博·全開</button>
  <button class="sw" data-v="max">B3 實心·滿版加粗</button>
  <button class="sw" data-v="panel">D 賽博龐克·面板</button>
  <button class="sw sun" id="sun">☀ 模擬太陽下</button>
</div>

<div id="stage" class="v-now">
  <div class="wrapbg"></div>
  <div class="wrap" id="wrap"></div>
</div>

<div class="note" id="note"></div>

<script>
var FL=[
 {t:'19:05',sub:'表定 +12',tc:'t-late',fno:'BR0028',flag:'🇯🇵',al:'長榮航空',gate:'C5',city:'東京成田',px:235,lv:2,tx:45,shop:'c0',st:'準備下機',sc:'b-warn',cls:'soon'},
 {t:'19:14',sub:'表定',tc:'t-plan',fno:'JX0025',flag:'🇺🇸',al:'星宇航空',gate:'A8',city:'鳳凰城',px:260,lv:3,tx:35,shop:'c1',st:'已起飛',sc:'b-ok',cls:''},
 {t:'19:28',sub:'表定 −6',tc:'t-early',fno:'CI0152',flag:'🇯🇵',al:'中華航空',gate:'B3',city:'大阪關西',px:205,lv:2,tx:25,shop:'',st:'已起飛',sc:'b-ok',cls:'plain'},
 {t:'19:40',sub:'表定',tc:'t-plan',fno:'BR0262',flag:'🇵🇭',al:'長榮航空',gate:'C9',city:'馬尼拉',px:130,lv:1,tx:20,shop:'c0',st:'未起飛',sc:'b-none',cls:''},
 {t:'18:33',sub:'表定 +3',tc:'t-late',fno:'TR0866',flag:'🇸🇬',al:'酷航',gate:'A2',city:'新加坡',px:300,lv:3,tx:30,shop:'c1',st:'已到站',sc:'b-ok',cls:'done'}
];
function card(f){
  var sh=f.shop==='c0'?' r40':(f.shop==='c1'?' r53':'');
  var tag=f.shop==='c0'?'2140':(f.shop==='c1'?'2153':'待定');
  return '<div class="r '+(f.cls||'')+sh+'"><i class="cor"></i>'
   +'<div class="c-time"><b class="'+f.tc+'">'+f.t+'</b><i>'+f.sub+'</i></div>'
   +'<div class="c-fno"><b>'+f.fno+'</b><i class="cty">'+f.flag+'</i></div>'
   +'<div class="c-gate"><b>'+f.gate+'</b></div>'
   +'<div class="c-city">'+f.city
     +'<i class="px p'+f.lv+'" style="font-style:normal">'+f.px+'<u>入境</u></i>'
     +'<i class="tx" style="font-style:normal">'+f.tx+'<u>轉機</u></i></div>'
   +'<div class="c-shop"><span class="tag">'+tag+'</span></div>'
   +'<div class="c-st"><span class="badge '+f.sc+'">'+f.st+'</span></div></div>';
}
function panelOpen(){
  return '<div class="pnl"><div class="plate"><span class="big">ARRIVALS</span>'
   +'<span>// TPE.T2</span><span class="hz"></span>'
   +'<span class="rec"><i></i>LIVE</span></div>'
   +'<div class="subbar"><span>NODE <b>2140 · 2153</b></span><span>SYNC <b>19:02:41</b></span>'
   +'<span>SRC <b>TPE.APT</b></span><span>WIN <b>18:00-24:00</b></span></div>'
   +'<div class="rows">';
}
function panelClose(){
  return '</div><div class="foot"><span>LISTED <b>05</b></span><span class="seg"></span>'
   +'<span>MINE <b>04</b></span><span>EOF</span></div></div>';
}
var HDR={
 now:'<div class="hdr">桃機到站 · 2140 / 2153<span>更新於 19:02</span></div>',
 cy :'<div class="hdr"><span class="t">TPE//T2</span><span class="sep">▸</span>ARRIVALS'
     +'<span class="r8"><i class="led"></i>SYNC 19:02:41</span></div>'
};
var NOTE={
 now:'<p>這是<b>你現在用的樣子</b>。按上面 B / C 看賽博版。</p>',
 soft:'<p><b>B 賽博·剛好</b>：數字全部換成等寬字（時間、班號、登機門天然對齊）、卡片切角做成 HUD 面板、'
     +'左側色帶改成發光燈條、標籤改成終端機風的方框、標題列變成狀態列。'
     +'<b>顏色沒換意思</b>：2140 還是青、2153 還是桃紅，只是調到更亮的霓虹值。'
     +'即將抵達從「呼吸光暈」改成<b>掃描線掠過</b>。重點是：字還是粗的、對比還是夠的。</p>',
 solid:'<p><b>B2 實心填滿</b>：跟 B 一模一樣，只差卡片底色——B 是從左邊漸層淡出，B2 是<b>整張用分點色填滿、不透明</b>。'
     +'好處是<b>一眼就看出整列是誰的</b>，不用看左邊那條；掃過去的時候色塊比漸層更快被認出來。'
     +'代價是底色變重，所以登機門、2140/2153 標籤我改成<b>實色小塊</b>（反白字），人數框墊一層黑底，不然會跟底色糊在一起。</p>'
     +'<p>記得按 <b>☀ 模擬太陽下</b> 比一下：實心底在強光下其實比漸層<b>更撐得住</b>，因為整片都有顏色可以對比。</p>',
 max:'<p><b>B3 實心·滿版加粗</b>：就是 B2，但<b>字全部推到極限</b>——時間 31→40px、班號 25→34、'
     +'登機門 30→40、城市 15→20、標籤和人數也各加一號，粗細全部拉到最粗；同時<b>內距砍掉</b>'
     +'（上下 8→5、左右 10→7），讓字去吃掉留白。</p>'
     +'<p><b>代價我量過了</b>：在 390 寬的手機（iPhone 一般尺寸）<b>高度不但沒增加，還少 3%</b>——'
     +'因為 B2 在那個寬度本來就會換行，字放大並沒有多換一行。'
     +'在 430 寬的大螢幕（Pro Max）會<b>高約 15%</b>，一個畫面大概少看半班到一班。</p>'
     +'<p>另外留了一道保險：螢幕窄於 400px 時字自動降一號，不然城市名長的（東京成田、大阪關西）會擠成三行。</p>',
 panel:'<p><b>D 賽博龐克·面板</b>：B2 的卡片不變，外面再套一層<b>機殼</b>——'
     +'左邊一條有刻度的導軌、上面一塊斜切的標題板配危險斜紋、右上角切角、下面一條分段狀態條。'
     +'機殼本身用<b>黃色</b>（賽博龐克那個招牌黃），分點色留給卡片，所以「哪些是框、哪些是資料」一眼分得開。</p>'
     +'<p>標題板上那些 <b>NODE / SYNC / SRC / WIN</b> 是真的有用的東西：分點、資料時間、來源、目前時段——'
     +'不是裝飾字。狀態改成 <b>[ 已起飛 ]</b> 中括號包起來。</p>'
     +'<p>代價：機殼本身吃掉左右各約 30px，手錶那種寬度會擠。手錶版我建議<b>只留卡片、不要機殼</b>。</p>',
 hard:'<p><b>C 賽博·全開</b>：再加上 CRT 掃描線疊在整頁、數字加霓虹光暈和左右錯位（色差）、'
     +'標題偶爾 glitch 抖一下、即將抵達改成強脈衝。<b>好看，但代價是清晰度</b>——'
     +'光暈會讓數字邊緣糊掉，掃描線在手錶那種小螢幕上會變成一層灰網。</p>'
     +'<p>按一下 <b>☀ 模擬太陽下</b>，就是你在 T2 門口陽光反射到螢幕上的狀況。'
     +'A 和 B 還讀得到，C 的時間和班號會先消失。</p>'
};
var st=document.getElementById('stage'),wp=document.getElementById('wrap'),nt=document.getElementById('note');
function paint(v){
  st.className=(v==='now'?'v-now':(v==='soft'?'cy v-soft':(v==='solid'?'cy v-solid':(v==='max'?'cy v-solid v-max':(v==='panel'?'cy v-panel':'cy v-hard')))));
  wp.innerHTML = (v==='panel')
    ? panelOpen()+FL.map(card).join('')+panelClose()
    : (v==='now'?HDR.now:HDR.cy)+FL.map(card).join('');
  nt.innerHTML=NOTE[v];
}
[].forEach.call(document.querySelectorAll('.sw[data-v]'),function(b){
  b.addEventListener('click',function(){
    [].forEach.call(document.querySelectorAll('.sw[data-v]'),function(x){x.className='sw'});
    b.className='sw on'; paint(b.getAttribute('data-v'));
  });
});
document.getElementById('sun').addEventListener('click',function(){
  var on=document.body.classList.toggle('sunon');
  this.className=on?'sw sun on':'sw sun';
});
paint('now');
</script>
</body>
</html>
