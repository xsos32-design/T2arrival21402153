<!DOCTYPE html>

<title>新排法 · 班機看板</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#0a0614;color:#e8e3f5;font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;font-weight:700;-webkit-text-size-adjust:100%;display:flex;flex-direction:column}
.ctl{flex:none;background:#120a1f;border-bottom:1px solid #00f0ff;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.ttl{font-size:13px;color:#f5ee0b;font-weight:900;white-space:nowrap}

  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
button.on{background:rgba(0,240,255,.16);border-color:#00f0ff;color:#00f0ff;box-shadow:0 0 12px -3px #00f0ff}

.pg.on{background:rgba(255,42,109,.18);border-color:#ff2a6d;color:#ff9ec0;box-shadow:none}

<body>
<div class="ctl">
  <div class="ttl">🧭 新排法・操作流程（還沒上線，按「J1 新排法」開關比對前後）<a href="../index.html">回正式版</a></div>
  <div class="row"><button class="pg on" data-u="../all.html">全時段</button><button class="pg" data-u="../index.html">一般時段</button><button class="pg" data-u="../depart.html">出境</button></div>
  <div class="row" id="sw"></div>
  <div class="tip" id="tip"></div>
</div>
<div class="stage"><iframe id="f" src="../all.html"></iframe></div>
<script>
var FEAT=[["J1", "新排法", "打開就看到兩排快捷鍵：「時段」（現在6H、00–06、13:30–18、18–24、整天）和「分類」（2140、2153、其他一航、其他二航），不用先按設定。不常用的（隱藏已抵達、區域、全部／全不要、選日期、分類設定、群組回報）收進下面一條「⚙ 篩選・日期・回報」；有藏東西時那條會寫出來（例如「已隱藏已抵達」）。重複的「更新班機」大按鈕拿掉（下面浮動按鈕的「更新」一樣能用）"]], J7JS="/* ══ 第七輪：排列方式／操作流程重排（J1）：只在 preview/j7.html 裡注入，正式版還沒上 ══\n   流程：打開 → 一眼看到「時段」「分類」兩排快捷鍵（不用先按設定）→ 資訊卡 → 搜尋 → 班機\n         不常用的（隱藏已抵達、區域、全部／全不要、選日期、分類設定、回報）收進「⚙ 篩選・回報」 */\n(function(){\n  var W=window, D=document, R=D.documentElement;\n  if(W.__j7) return; W.__j7=1; W.__J=W.__J||{};\n  var css=D.createElement('style'); css.textContent=[\n  /* 快捷區：兩排，永遠看得到 */\n  '#qbar{margin:0 0 10px;padding:10px;background:linear-gradient(118deg,rgba(255,255,255,.07),rgba(255,255,255,0) 30%),rgba(18,10,31,.6);border:1px solid rgba(0,240,255,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}',\n  '#qbar .qr{display:grid;gap:6px;align-items:stretch}',\n  '#qbar #qtime{grid-template-columns:repeat(3,1fr)}',\n  '#qbar #qshop{grid-template-columns:repeat(4,1fr)}',\n  '#qbar .qr+.qr{margin-top:8px}',\n  '#qbar .qr .chip{min-width:0!important;width:auto!important;margin:0!important;padding:7px 2px!important;min-height:40px!important;font-size:14.5px!important;text-align:center;justify-content:center;white-space:nowrap;letter-spacing:-.02em}',\n  '#qbar #qshop{display:grid;gap:6px}',\n  '#qbar #shopslot{display:contents}',\n  '#qbar #now6 .ic{display:none}',\n  '#qtool{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;margin-top:8px;font:inherit;font-size:13.5px;font-weight:900;padding:7px 12px!important;cursor:pointer;min-height:38px;background:rgba(26,16,48,.7);border:1px dashed rgba(0,240,255,.4);color:#b9aed6;position:relative;text-align:left}',\n  '#qtool b{color:#00f0ff;white-space:nowrap}',\n  'html #qbar #qtool{height:auto!important;line-height:1.35!important;font-size:13.5px!important;letter-spacing:0!important;clip-path:none!important;box-shadow:none!important;margin-bottom:0!important;flex-wrap:nowrap!important}',\n  '#qtool span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',\n  '#qtool.on{background:rgba(0,240,255,.16);border-color:#00f0ff;color:#00f0ff}',\n  '#qtool i{display:none;font-style:normal;color:#ff9ec0}',\n  '#qtool.dot i{display:inline}',\n  /* 原本的設定卡：收起時整塊不見（快捷區已經有時段和分類）；打開時只剩不常用的 */\n  'html.hJ1 .wrap>.card:not(.open){display:none!important}',\n  'html.hJ1 #ctlbar{display:none!important}',\n  'html.hJ1 #go{display:none!important}',\n  'html.hJ1 .wrap>.card.open{margin-top:-4px;border-color:rgba(0,240,255,.6)!important}',\n  'html.hJ1 #ctl>.chips.j7empty,html.hJ1 #ctl .j7empty{display:none!important}'\n  ].join('\\n'); D.head.appendChild(css);\n\n  var built=false, home={};\n  function build(){\n    var card=D.querySelector('.wrap>.card'), ctl=D.getElementById('ctl'), slot=D.getElementById('shopslot');\n    if(!card||!ctl||!slot) return false;\n    var q=D.createElement('div'); q.id='qbar';\n    q.innerHTML='<div class=\"qr\" id=\"qtime\"><\/div><div class=\"qr\" id=\"qshop\"><\/div><button type=\"button\" id=\"qtool\"><span>⚙ 篩選・日期・回報 <i><\/i><\/span><b>展開 ▾<\/b><\/button>';\n    card.parentNode.insertBefore(q,card);\n    /* 時段：現在6小時排第一，後面接固定時段 */\n    var qt=q.querySelector('#qtime'), n6=D.getElementById('now6');\n    home.n6=[n6.parentNode,n6.nextSibling]; qt.appendChild(n6);\n    var ts=[].slice.call(ctl.querySelectorAll('.chip[data-t]')); home.ts=ts.map(function(c){ return [c.parentNode,c.nextSibling]; });\n    ts.forEach(function(c){ qt.appendChild(c); });\n    n6.__j7txt=n6.innerHTML;\n    home.slot=[slot.parentNode,slot.nextSibling]; q.querySelector('#qshop').appendChild(slot);\n    /* 設定卡裡剩下的重新排：顯示 → 區域 → 分類全選 → 選日期 → 分類設定 → 回報 */\n    home.order=[].slice.call(ctl.children);\n    var rows=[].slice.call(ctl.children);\n    function find(fn){ return rows.filter(fn)[0]; }\n    var rShow=find(function(r){ return r.querySelector&&r.querySelector('#hide'); });\n    var rZone=find(function(r){ return r.querySelector&&r.querySelector('.chip.zone'); });\n    var rAll=find(function(r){ return r.querySelector&&r.querySelector('#sall'); });\n    var rRep=find(function(r){ return r.querySelector&&r.querySelector('#cpD'); });\n    var cbox=D.getElementById('copybox');\n    var dets=rows.filter(function(r){ return r.tagName==='DETAILS'; });\n    [rShow,rZone,rAll].concat(dets,[rRep,cbox]).forEach(function(r){ if(r) ctl.appendChild(r); });\n    rows.forEach(function(r){ if(r.classList&&r.classList.contains('chips')&&!r.querySelector('.chip,button')) r.classList.add('j7empty'); });\n    var lab=rAll&&rAll.querySelector('.v2lab'); if(lab){ lab.__j7=lab.textContent; lab.textContent='分類全選'; }\n    q.querySelector('#qtool').onclick=function(){ var b=D.getElementById('ctlbar'); if(b) b.click(); setTimeout(paint,30);\n      if(card.classList.contains('open')) setTimeout(function(){ try{ scrollTo({top:card.getBoundingClientRect().top+scrollY-70,behavior:'smooth'}); }catch(e){} },60); };\n    built=true; return true;\n  }\n  function unbuild(){\n    if(!built) return; var q=D.getElementById('qbar'), ctl=D.getElementById('ctl');\n    var n6=D.getElementById('now6'); if(n6.__j7txt) n6.innerHTML=n6.__j7txt;\n    home.n6[0].insertBefore(n6,home.n6[1]);\n    var ts=[].slice.call(q.querySelectorAll('.chip[data-t]')); ts.forEach(function(c,i){ home.ts[i][0].appendChild(c); });\n    home.slot[0].insertBefore(D.getElementById('shopslot'),home.slot[1]);\n    home.order.forEach(function(r){ ctl.appendChild(r); r.classList&&r.classList.remove('j7empty'); });\n    [].forEach.call(ctl.querySelectorAll('.v2lab'),function(l){ if(l.__j7){ l.textContent=l.__j7; l.__j7=null; } });\n    q.remove(); built=false;\n  }\n  function paint(){\n    var on=!!W.__J.J1; R.classList.toggle('hJ1',on);\n    if(on&&!built) build(); if(!on&&built) unbuild(); if(!on) return;\n    var card=D.querySelector('.wrap>.card'), t=D.getElementById('qtool');\n    var open=card&&card.classList.contains('open'); t.classList.toggle('on',open);\n    /* 有藏東西就在 ⚙ 上亮紅點，下面寫一行提醒 */\n    var hid=D.getElementById('hide'), zs=[].filter.call(D.querySelectorAll('.chip.zone'),function(z){ return !z.classList.contains('act'); }).map(function(z){ return z.textContent.replace(/[✓\\s區]/g,''); });\n    var msg=[]; if(hid&&hid.classList.contains('act')) msg.push(/出境/.test(D.title)?'已隱藏已起飛':'已隱藏已抵達'); if(zs.length) msg.push('沒看 '+zs.join('')+' 區');\n    t.classList.toggle('dot',msg.length>0); t.querySelector('i').textContent=msg.length?'（'+msg.join('、')+'）':''; t.querySelector('b').textContent=open?'收起 ▴':'展開 ▾';\n  }\n  W.__j7paint=paint;\n  var wait=setInterval(function(){ if(typeof W.render!=='function'||!D.getElementById('ctl')) return; clearInterval(wait);\n    var _r=W.render; W.render=function(){ var x=_r.apply(this,arguments); try{ paint(); }catch(e){ console.log('j7',e); } return x; };\n    try{ paint(); }catch(e){} },100);\n  D.addEventListener('click',function(){ setTimeout(function(){ try{ paint(); }catch(e){} },40); });\n})();\n";
var ON={}; FEAT.forEach(function(f){ ON[f[0]]=true; }); var LAST='J1';
var sw=document.getElementById('sw');
sw.innerHTML=FEAT.map(function(f){ return '<button class="on" data-k="'+f[0]+'">'+f[0]+' '+f[1]+'</button>'; }).join('');
function paint(){
  [].forEach.call(sw.querySelectorAll('[data-k]'),function(b){ b.classList.toggle('on',!!ON[b.dataset.k]); });
  
  var f=FEAT.filter(function(x){ return x[0]===LAST; })[0];
  document.getElementById('tip').innerHTML='<b>'+f[0]+' '+f[1]+'</b>（'+(ON[f[0]]?'開':'關')+'）：'+f[2];
}
function apply(){
  var w, d; try{ w=document.getElementById('f').contentWindow; d=w.document; }catch(e){ return; } if(!d||!d.body) return;
  w.__J=JSON.parse(JSON.stringify(ON));
  if(!w.__j7){ var s=d.createElement('script'); s.textContent=J7JS; d.body.appendChild(s); }
  try{ if(w.__j7paint) w.__j7paint(); }catch(e){}
}
[].forEach.call(document.querySelectorAll('.pg'),function(b){ b.onclick=function(){ [].forEach.call(document.querySelectorAll('.pg'),function(x){ x.classList.toggle('on',x===b); }); document.getElementById('f').src=b.dataset.u; }; });
sw.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.s){ try{ document.getElementById('f').contentWindow[b.dataset.s](); }catch(_){ } return; }
  var k=b.dataset.k; ON[k]=!ON[k]; LAST=k; paint(); apply(); });
document.getElementById('f').addEventListener('load',function(){ setTimeout(apply,800); setTimeout(apply,4000); });
paint();
</script>
</body>
