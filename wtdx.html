<!DOCTYPE html>
<!-- 桃機到站 · 手錶 TDX 連線版（即時）　檔案作者：小韋 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>班機TDX版 · 即時</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0d10;color:#f2f4f7;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
 font-size:16px;line-height:1.35;padding:6px}
.hd{display:flex;align-items:center;gap:5px;font-size:12px;color:#8b94a1;padding:7px 8px;margin-bottom:7px;
 background:#14171c;border:1px solid #262b33;border-radius:10px;min-height:38px;overflow:hidden;cursor:pointer}
.hd>*{white-space:nowrap;flex:0 0 auto}
.hd b{color:#cbd5e1;font-size:13px}
.hd .u{margin-left:auto;color:#7dd3fc;font-weight:700}
.hd .u.busy{color:#fbbf24}
.hd .u.err{color:#f87171}
.r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 7px;
 background:#14171c;border:1px solid #262b33;border-radius:11px;padding:8px 9px;margin-bottom:6px;overflow:hidden}
.r.done{opacity:.38}
.r.soon{background:#3a2f10;border-color:#a16207}
b.t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;
 padding:0 6px;border-radius:7px;display:inline-block}
.t-late{color:#fcd34d;background:#3f2c08}
.t-early{color:#7dd3fc;background:#0b2b3c}
.t-same{color:#6ee7b7;background:#0d2f1e}
.t-plan{color:#fff;padding-left:0}
.g{font-size:25px;font-weight:800;color:#fff;text-align:center;white-space:nowrap;line-height:1.05}
.tag{font-size:11px;font-weight:800;padding:2px 5px;border-radius:6px;text-align:right;white-space:nowrap;align-self:center}
.s53{background:#43200f;color:#fdba74} .s40{background:#0d3b36;color:#5eead4}
.st1{background:#2a1f4a;color:#c4b5fd} .st2{background:#232830;color:#9aa3b0}
.f{font-size:15px;font-weight:700;color:#e5e9ef;white-space:nowrap}
.c{font-size:13.5px;color:#8b94a1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.st{font-size:11.5px;font-weight:700;padding:2px 5px;border-radius:6px;text-align:center;white-space:nowrap;align-self:center}
.b-ok{background:#0e2f1b;color:#4ade80} .b-warn{background:#3a2a0c;color:#fbbf24}
.b-bad{background:#3b1414;color:#f87171} .b-none{background:#232830;color:#8b94a1}
.b-info{background:#0b2b3c;color:#7dd3fc}
.day{background:#16233c;border:1px solid #2e4a7a;color:#93c5fd;font-size:13.5px;font-weight:800;
 border-radius:10px;padding:7px 8px;margin:9px 0 6px;text-align:center}
.msg{background:#14171c;border:1px solid #262b33;border-radius:9px;padding:12px;color:#8b94a1;font-size:12px;text-align:center}
.msg.err{background:#3b1414;border-color:#7f1d1d;color:#fca5a5}
.grp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.btn{flex:1 1 100%;min-height:50px;display:flex;align-items:center;justify-content:center;
 background:#1c2027;border:2px solid #2e343d;border-radius:12px;color:#9aa3b0;
 font-size:16px;font-weight:650;text-decoration:none;text-align:center;padding:9px 4px;cursor:pointer;user-select:none}
.btn.on{background:#16324f;border-color:#3b82f6;color:#bfdbfe}
.btn.zone{flex:1 1 46%}
.sep{border-top:1px solid #262b33;margin:10px 0}
.foot{color:#5b636e;font-size:10.5px;text-align:center;padding:8px 4px 2px;line-height:1.6}
.notice{background:#2e2408;border:1px solid #5c4708;color:#fcd34d;font-size:11.5px;
 padding:8px 9px;border-radius:10px;margin:9px 0;line-height:1.55;text-align:center}
.notice b{color:#fde68a}
#fb .fbx{background:#2e2408;border:1px solid #5c4708;color:#fcd34d;font-size:11.5px;
 padding:8px 9px;border-radius:10px;margin-bottom:6px;line-height:1.5;text-align:center}
@media(min-width:420px){
 body{max-width:680px;margin:0 auto;padding:14px}
 .r{grid-template-columns:auto auto auto auto 1fr auto;align-items:center;gap:4px 12px;padding:8px 12px}
 .g{min-width:52px} .tag{text-align:center}
 .btn{flex:0 0 auto;padding:8px 18px;min-height:40px}
}
</style>
</head>
<body>

<div class="hd" id="hd"><b>✈️ 班機TDX版</b><span id="hdate">—</span><span>即時</span><span class="u" id="hstamp">載入中…</span></div>

<div class="grp">
  <span class="btn" id="ball">全部</span>
  <span class="btn" id="bmine">2140+2153</span>
</div>
<div class="grp">
  <span class="btn cat" data-c="40">　2140</span>
  <span class="btn cat" data-c="53">　2153</span>
  <span class="btn cat" data-c="t1">　一航</span>
  <span class="btn cat" data-c="t2">　二航</span>
</div>
<div class="grp">
  <span class="btn zone" data-z="A">　A區</span>
  <span class="btn zone" data-z="B">　B區</span>
  <span class="btn zone" data-z="C">　C區</span>
  <span class="btn zone" data-z="D">　D區</span>
</div>
<div class="grp">
  <span class="btn pre" data-t="00:00" data-e="05:59">00–06</span>
  <span class="btn pre" data-t="06:00" data-e="11:59">06–12</span>
  <span class="btn pre" data-t="12:00" data-e="17:59">12–18</span>
  <span class="btn pre" data-t="18:00" data-e="23:59">18–24</span>
</div>
<div class="grp"><span class="btn" id="bnow">⏱ 現在起 6 小時</span></div>
<div class="grp"><span class="btn" id="bhide">🙈 隱藏已抵達：否</span></div>
<div class="grp"><span class="btn" id="breload">🔄 立即更新</span></div>

<div class="sep"></div>
<div id="fb"></div>
<div id="list"><div class="msg">載入中…</div></div>

<div class="notice">⚠️ 本頁資料為 TDX 交通部即時資料，僅供參考。<br><b>實際登機門、時間與班機狀態，一律以現場班機營運為主。</b><br>此來源沒有「滑行中／抵達機坪」，抵達的班機一律顯示 ✅ 已抵達。</div>
<div class="foot">按 🔄 或點最上面那條即可重抓當下資料。<br><br><a class="btn" style="display:inline-flex;min-height:40px;padding:8px 16px;font-size:12px" href="wtest.html">連線測試</a><br><br>檔案作者：小韋</div>

<script>
/* ── 分點別登機門（跟其他版本同一套設定）─────────────────── */
var SPEC_2140='C1-C4, C5R, B6-B9';
var SPEC_2153='C5, C6-C10';

var GATE_ORDER=(function(){
  var o=[],i;
  for(i=1;i<=10;i++) o.push('A'+i);
  ['B1','B1R','B2','B3','B4','B5','B6','B7','B8','B9'].forEach(function(g){o.push(g)});
  ['C1','C2','C3','C4','C5','C5R','C6','C7','C8','C9','C10'].forEach(function(g){o.push(g)});
  var d=['D1','D2','D3','D4','D5','D5R'];
  for(i=6;i<=18;i++) d.push('D'+i);
  d.forEach(function(g){o.push(g)});
  return o;
})();
function expandSpec(spec){
  var set={};
  spec.split(/[,，、]/).forEach(function(p){
    var part=p.trim().toUpperCase(); if(!part) return;
    var m=part.match(/^([A-D]\d+R?)\s*[-–—~]\s*([A-D]\d+R?)$/);
    if(m){
      var a=GATE_ORDER.indexOf(m[1]), b=GATE_ORDER.indexOf(m[2]);
      if(a>=0&&b>=0){ var lo=Math.min(a,b), hi=Math.max(a,b);
        for(var i=lo;i<=hi;i++) set[GATE_ORDER[i]]=1; }
    } else set[part]=1;
  });
  return set;
}
var G40=expandSpec(SPEC_2140), G53=expandSpec(SPEC_2153);

/* ── 小工具 ── */
function hhmm(t){ return (t||'').slice(0,5); }
function pad(x){ return (x<10?'0':'')+x; }
function mins(t){ var p=hhmm(t).split(':'); return (+p[0])*60+(+p[1]); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]}); }

/* ── TDX ── */
var TDX_ARR='https://tdx.transportdata.tw/api/basic/v2/Air/FIDS/Airport/Arrival/TPE'
  +'?%24select=FlightDate,FlightNumber,AirlineID,DepartureAirportID,ScheduleArrivalTime,'
  +'EstimatedArrivalTime,ActualArrivalTime,Terminal,Gate,ArrivalRemark&%24format=JSON';
var TDX_AP='https://tdx.transportdata.tw/api/basic/v2/Air/Airport'
  +'?%24select=AirportID,AirportName,AirportCityName&%24format=JSON';

var NAMES=null;
function tdxNames(){
  if(NAMES) return Promise.resolve(NAMES);
  /* 城市中文名改從同網域快照撈（同網域不吃 TDX 額度）：
     快照是 GitHub 用金鑰抓的，名字齊全。這樣每次更新只打 1 次 TDX，額度省一半 */
  return fetch('data.json?nc='+Date.now()).then(function(r){ return r.ok?r.json():{d:[]}; }).then(function(j){
    var m={};
    ((j&&j.d)||[]).forEach(function(f){
      if(f.Dep&&f.CityName&&f.CityName!==f.Dep) m[f.Dep]=f.CityName;
    });
    NAMES=m; return m;
  })['catch'](function(){ return {}; });
}
function fromTDX(f,names){
  var hm=function(s){ return (String(s||'').split('T')[1]||'').slice(0,5); };
  var dt=function(s){ return String(s||'').split('T')[0].replace(/-/g,'/'); };
  var sch=f.ScheduleArrivalTime||'', act=f.ActualArrivalTime||f.EstimatedArrivalTime||'';
  var rm=f.ArrivalRemark||'', memo='';
  if(/取消|CANCEL/i.test(rm))                        memo='取消';
  else if(/已到|ARRIVED|LANDED/i.test(rm))           memo='已到';
  else if(/延誤|延遲|DELAY/i.test(rm))               memo='延遲';
  else if(/時間更改|變更|SCHEDULE CHANGE/i.test(rm)) memo='時間更改';
  else if(/準時|ON TIME/i.test(rm))                  memo='準時';
  var s=hm(sch), a=hm(act);
  return {
    BNO:String(f.Terminal||''), Gate:String(f.Gate||'').trim(),
    ODate:dt(sch), OTime:s?s+':00':'',
    RDate:dt(act), RTime:(a&&(a!==s||memo))?a+':00':'',
    Dep:String(f.DepartureAirportID||''),
    CityName:names[f.DepartureAirportID]||f.DepartureAirportID||'',
    flightCode:String(f.AirlineID||'')+String(f.FlightNumber||''),
    Memo:memo
  };
}
function mergeCodeshare(list){
  var keys=[], map={};
  list.forEach(function(f){
    var k=f.ODate+'|'+f.OTime+'|'+f.Gate+'|'+f.BNO+'|'+f.CityName;
    if(!map.hasOwnProperty(k)){ map[k]=f; keys.push(k); return; }
    var m=map[k];
    if(!m.RTime && f.RTime){ m.RTime=f.RTime; m.RDate=f.RDate; }
    if(!m.Memo && f.Memo) m.Memo=f.Memo;
  });
  return keys.map(function(k){ return map[k]; });
}

/* ── 狀態（含表情符號）── */
function statusOf(f){
  var memo=f.Memo||'';
  if(/取消/.test(memo)) return {txt:'❌ 取消',    cls:'bad', done:false};
  if(/已到/.test(memo)) return {txt:'✅ 已抵達',  cls:'ok',  done:true };
  if(/延遲|延誤/.test(memo)) return {txt:'🕐 延誤', cls:'warn',done:false};
  if(/更改|變更/.test(memo)) return {txt:'🔀 更改', cls:'warn',done:false};
  if(/準時/.test(memo)) return {txt:'🟢 準時',   cls:'info',done:false};
  return {txt:'預計', cls:'none', done:false};
}
function shopOf(f){
  var g=(f.Gate||'').trim().toUpperCase();
  if(String(f.BNO)==='1') return 't1';
  if(g && G40[g]) return '40';
  if(g && G53[g]) return '53';
  return 't2';
}
var TAG={'40':{txt:'2140',cls:'s40'},'53':{txt:'2153',cls:'s53'},
         't1':{txt:'一航',cls:'st1'},'t2':{txt:'二航',cls:'st2'}};

/* ── 畫面狀態 ── */
var cats={'40':true,'53':true,'t1':true,'t2':true};
var zones={'A':true,'B':true,'C':true,'D':true};   /* 登機門開頭字母（607 這種無字母的一律顯示） */
var win=['00:00','23:59'];
var mode='win';      /* 'win'=固定時段  'now6'=現在起6小時 */
var hideDone=false;
var DATA=[];
var DATA2=null;      /* 隔日班機：現在起6小時跨日時才載入（null=還沒抓 []=抓不到或沒有） */

function allOn(){ return cats['40']&&cats['53']&&cats['t1']&&cats['t2']; }
function mineOn(){ return cats['40']&&cats['53']&&!cats['t1']&&!cats['t2']; }

function paintBtns(){
  document.getElementById('ball').className='btn'+(allOn()?' on':'');
  document.getElementById('bmine').className='btn'+(mineOn()?' on':'');
  [].forEach.call(document.querySelectorAll('.cat'),function(b){
    var on=cats[b.getAttribute('data-c')];
    b.className='btn cat'+(on?' on':'');
    b.textContent=(on?'✓ ':'　')+b.textContent.replace(/^[✓　]\s?/,'');
  });
  [].forEach.call(document.querySelectorAll('.zone'),function(b){
    var on=zones[b.getAttribute('data-z')];
    b.className='btn zone'+(on?' on':'');
    b.textContent=(on?'✓ ':'　')+b.textContent.replace(/^[✓　]\s?/,'');
  });
  [].forEach.call(document.querySelectorAll('.pre'),function(b){
    b.className='btn pre'+((mode==='win'&&b.getAttribute('data-t')===win[0]&&b.getAttribute('data-e')===win[1])?' on':'');
  });
  var bn=document.getElementById('bnow');
  bn.className='btn'+(mode==='now6'?' on':'');
  if(mode==='now6'){
    /* 按鈕直接顯示目前套用的區間 */
    var nb=new Date(), nm=nb.getHours()*60+nb.getMinutes();
    var s0=nm-30; if(s0<0) s0=0;
    var e0=nm+360;
    var loL=pad(Math.floor(s0/60))+':'+pad(s0%60);
    var hiL=e0>=1440?pad(Math.floor((e0-1440)/60))+':'+pad((e0-1440)%60):pad(Math.floor(e0/60))+':'+pad(e0%60);
    bn.textContent='⏱ '+pad(nb.getHours())+':'+pad(nb.getMinutes())+' 按下　'+loL+'–'+(e0>=1440?'隔日':'')+hiL;
  } else bn.textContent='⏱ 現在起 6 小時';
  document.getElementById('bhide').className='btn'+(hideDone?' on':'');
  document.getElementById('bhide').textContent='🙈 隱藏已抵達：'+(hideDone?'是':'否');
}

function rowsFor(list,lo,hi){
  return (list||[]).filter(function(f){
    if(!f.Gate) return false;
    var t=hhmm(f.RTime)||hhmm(f.OTime);
    if(t<lo||t>hi) return false;
    if(!cats[shopOf(f)]) return false;
    var zg=(f.Gate||'').trim().charAt(0).toUpperCase();
    if(/[A-D]/.test(zg)&&!zones[zg]) return false;
    if(hideDone&&statusOf(f).done) return false;
    return true;
  }).sort(function(a,b){
    var ta=hhmm(a.RTime)||hhmm(a.OTime), tb=hhmm(b.RTime)||hhmm(b.OTime);
    return ta.localeCompare(tb)||hhmm(a.OTime).localeCompare(hhmm(b.OTime));
  });
}
function rowHtml(f,nowMin){
  var st=statusOf(f);
  var sch=hhmm(f.OTime), act=hhmm(f.RTime);
  var big,tc,sub;
  if(act){
    var d=mins(f.RTime)-mins(f.OTime);
    big=act; tc=d>0?'late':(d<0?'early':'same');
    sub='表定'+sch+(d?(d>0?' +':' −')+Math.abs(d):'');
  } else { big=sch; tc='plan'; sub='表定'; }
  var eta=mins(big)-nowMin;
  var cls=st.done?'done':((nowMin>=0&&eta>=0&&eta<=45)?'soon':'');
  var tg=TAG[shopOf(f)];
  return '<div class="r '+cls+'">'
    +'<b class="t t-'+tc+'">'+big+'</b><span class="g">'+esc(f.Gate)+'</span><span class="tag '+tg.cls+'">'+tg.txt+'</span>'
    +'<span class="f">'+esc(f.flightCode)+'</span><span class="c">'+esc(f.CityName)+'</span><span class="st b-'+st.cls+'">'+st.txt+'</span>'
    +'</div>';
}
function render(){
  var n=new Date(), nowMin=n.getHours()*60+n.getMinutes();
  var html='';
  if(mode==='now6'){
    /* 按下時間往前半小時、往後六小時（例：13:00 → 12:30–19:00）；跨日分兩段插日期分隔列 */
    var startMin=nowMin-30; if(startMin<0) startMin=0;   /* 凌晨半小時內就從 00:00 起 */
    var lo=pad(Math.floor(startMin/60))+':'+pad(startMin%60);
    var endRaw=nowMin+360, cross=endRaw>=1440;
    var hi=cross?'23:59':pad(Math.floor(endRaw/60))+':'+pad(endRaw%60);
    html=rowsFor(DATA,lo,hi).map(function(f){ return rowHtml(f,nowMin); }).join('');
    if(!html) html='<div class="msg">今天接下來這段沒有符合的班機</div>';
    if(cross){
      var m2=new Date(n.getTime()+86400000);
      var hi2=pad(Math.floor((endRaw-1440)/60))+':'+pad((endRaw-1440)%60);
      html+='<div class="day">📅 '+(m2.getMonth()+1)+'/'+m2.getDate()+' 班機</div>';
      if(DATA2===null){
        html+='<div class="msg">隔日資料載入中…</div>';
      } else {
        var part2=rowsFor(DATA2,'00:00',hi2).map(function(f){ return rowHtml(f,-1); }).join('');
        html+=part2||'<div class="msg">隔日這段沒有符合的班機'+(DATA2.length?'':'（或資料還抓不到，按 🔄 再試）')+'</div>';
      }
    }
  } else {
    html=rowsFor(DATA,win[0],win[1]).map(function(f){ return rowHtml(f,nowMin); }).join('');
    if(!html) html='<div class="msg">這個區間沒有符合的班機'+(hideDone?'<br>（目前隱藏了已抵達的班機）':'')+'</div>';
  }
  document.getElementById('list').innerHTML=html;
  paintBtns();
}
/* 跨日時把隔日班機抓回來（即時失敗就退快照；只在需要時才多打這 1 次） */
function ensureTomorrow(){
  var n=new Date();
  if(n.getHours()*60+n.getMinutes()+360<1440) return;   /* 沒跨日就不用 */
  if(DATA2!==null) return;
  var m2=new Date(n.getTime()+86400000);
  var iso=m2.getFullYear()+'-'+pad(m2.getMonth()+1)+'-'+pad(m2.getDate());
  var day=iso.replace(/-/g,'/');
  var url=TDX_ARR+'&%24filter='+encodeURIComponent('date(FlightDate) eq '+iso)+'&nc='+Date.now();
  fetch(url).then(function(r){ if(!r.ok) throw new Error('TDX '+r.status); return r.json(); })
  .then(function(list){
    DATA2=mergeCodeshare((list||[]).map(function(f){ return fromTDX(f,NAMES||{}); }))
          .filter(function(f){ return f.ODate===day||f.RDate===day; });
    render();
  })['catch'](function(){
    fetch('data.json?nc='+Date.now()).then(function(r){ return r.ok?r.json():{d:[]}; }).then(function(j){
      DATA2=((j&&j.d)||[]).filter(function(f){ return f.ODate===day||f.RDate===day; });
      render();
    })['catch'](function(){ DATA2=[]; render(); });
  });
}

function load(){
  var el=document.getElementById('hstamp');
  el.textContent='更新中…'; el.className='u busy';
  var d0=new Date();
  var iso=d0.getFullYear()+'-'+pad(d0.getMonth()+1)+'-'+pad(d0.getDate());
  /* 只抓今天的班機（620KB→200KB），手錶才吞得下；25 秒沒回應就放棄 */
  var url=TDX_ARR+'&%24filter='+encodeURIComponent('date(FlightDate) eq '+iso)+'&nc='+Date.now();
  var bail=new Promise(function(x,rej){ setTimeout(function(){ rej(new Error('逾時，25 秒沒回應')); },25000); });
  Promise.race([bail,
    fetch(url).then(function(r){
      if(!r.ok) throw new Error('TDX 回應 '+r.status); return r.json(); })
  ]).then(function(list){
    var n=new Date();
    var today=n.getFullYear()+'/'+pad(n.getMonth()+1)+'/'+pad(n.getDate());
    DATA=mergeCodeshare((list||[]).map(function(f){ return fromTDX(f,NAMES||{}); }))
         .filter(function(f){ return f.ODate===today||f.RDate===today; });
    document.getElementById('hdate').textContent=(n.getMonth()+1)+'/'+n.getDate();
    el.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+' ↻'; el.className='u';
    document.getElementById('fb').innerHTML='';
    DATA2=null;                       /* 重新整理後隔日資料也重抓 */
    if(mode==='now6') ensureTomorrow();
    render();   /* 班機先上畫面（出發地暫時顯示代碼） */
    tdxNames().then(function(nm){   /* 城市中文名背景補上，抓不到也不影響 */
      if(!nm) return;
      DATA.forEach(function(f){ if(f.Dep&&nm[f.Dep]) f.CityName=nm[f.Dep]; });
      render();
    });
  })['catch'](function(e){ fallback(e); });
}

/* TDX 直連失敗 → 改抓同網域的 GitHub 快照（手錶一定讀得到，只是非即時） */
function fallback(err){
  var el=document.getElementById('hstamp');
  fetch('data.json?nc='+Date.now())
  .then(function(r){ if(!r.ok) throw new Error('快照 '+r.status); return r.json(); })
  .then(function(j){
    var n=new Date();
    var today=n.getFullYear()+'/'+pad(n.getMonth()+1)+'/'+pad(n.getDate());
    DATA=(j.d||[]).filter(function(f){ return f.ODate===today||f.RDate===today; });
    var m2=new Date(n.getTime()+86400000);
    var tm=m2.getFullYear()+'/'+pad(m2.getMonth()+1)+'/'+pad(m2.getDate());
    DATA2=(j.d||[]).filter(function(f){ return f.ODate===tm; });
    document.getElementById('hdate').textContent=(n.getMonth()+1)+'/'+n.getDate();
    el.textContent=j.t+' 快照'; el.className='u busy';
    document.getElementById('fb').innerHTML=
      '<div class="fbx">📡 即時連線失敗（'+esc(err&&err.message||err)+'）<br>'
      +'已改用 GitHub 於 <b>'+esc(j.t)+'</b> 抓的快照，非即時。按 🔄 可再試即時連線。</div>';
    render();
  })
  ['catch'](function(e2){
    el.textContent='失敗 ↻'; el.className='u err';
    document.getElementById('list').innerHTML=
      '<div class="msg err">即時（'+esc(err&&err.message||err)+'）和快照（'+esc(e2&&e2.message||e2)
      +'）都抓不到<br>正在自我診斷…</div>';
    diag(function(out){
      document.getElementById('list').innerHTML=
        '<div class="msg err">即時連線失敗：'+esc(err&&err.message||err)
        +'<br><br>診斷結果<br>同網域讀檔：'+esc(out.same)
        +'<br>TDX 小請求：'+esc(out.tdx)
        +'<br><br>把上面兩行抄給小韋的助手就能對症下藥。點 🔄 重試</div>';
    });
  });
}

/* 兩關都倒才會跑：測「同網域」和「TDX 小請求」各自通不通 */
function diag(cb){
  var out={}, c=0;
  function done(){ if(++c===2) cb(out); }
  function t(key,url){
    var f=false;
    var to=setTimeout(function(){ if(!f){ f=true; out[key]='逾時'; done(); } },8000);
    try{
      fetch(url).then(function(r){ if(f)return; f=true; clearTimeout(to); out[key]='通（HTTP '+r.status+'）'; done(); })
      ['catch'](function(er){ if(f)return; f=true; clearTimeout(to); out[key]='不通（'+((er&&er.message)||er)+'）'; done(); });
    }catch(er){ if(!f){ f=true; clearTimeout(to); out[key]='不通（'+((er&&er.message)||er)+'）'; done(); } }
  }
  t('same','watch.html?nc='+Date.now());
  t('tdx','https://tdx.transportdata.tw/api/basic/v2/Air/Airport?%24top=1&%24format=JSON&nc='+Date.now());
}
