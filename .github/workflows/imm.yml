name: 移民署人數（用你的電腦抓）

# 移民署的「入出境人次預報」只開放台灣的網路連線，GitHub 自己的機器（在美國）連不到。
# 所以這支工作流程指定在「你的電腦」上跑（self-hosted runner）。電腦關機時它就排隊等，
# 看板會自動退回只用桃機的數字，不會壞。
# 用 GitHub 內建的 JavaScript（github-script）來跑：不需要動 Windows 的任何安全設定。
on:
  schedule:
    - cron: '4,34 * * * *'      # 每半小時一次（移民署每小時整點更新）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: imm
  cancel-in-progress: true

jobs:
  imm:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 6
    steps:
      - name: 抓移民署入出境人次，存到 data/imm.json
        uses: actions/github-script@v8
        with:
          script: |
            const tw = new Date(Date.now() + 8 * 3600e3);
            const stamp = tw.toISOString().slice(0, 16).replace('T', ' ');

            async function getImm(code, topN) {
              const r = await fetch('https://opendata.immigration.gov.tw/APIS/' + code, {
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)', Accept: 'application/json' },
                signal: AbortSignal.timeout(60000),
              });
              if (!r.ok) throw new Error(code + ' HTTP ' + r.status);
              const rows = await r.json();
              let total = 0; const nat = {}, age = {};
              for (const x of rows) {
                const n = parseInt(x.paxCnt, 10) || 0; total += n;
                const k = String(x.nationality); nat[k] = (nat[k] || 0) + n;
                const a = String(x.age);         age[a] = (age[a] || 0) + n;
              }
              const top = {};
              Object.entries(nat).sort((p, q) => q[1] - p[1]).slice(0, topN).forEach(([k, v]) => { top[k] = v; });
              return { total, nat: top, age };
            }

            const cur = {
              t: stamp,
              in2: await getImm('TPE12', 15),          // 第二航廈 入境
              out2: await getImm('TPE52', 15),         // 第二航廈 出境
              in1d: await getImm('TPE11', 15),         // 第一航廈 入境（10/19 起也存國籍，看板可切一航）
              out1d: await getImm('TPE51', 15),        // 第一航廈 出境
              trans: await getImm('TPE3', 10),         // 全機場 過境
            };
            cur.in1 = cur.in1d.total;  cur.out1 = cur.out1d.total;   // 舊欄位照留（歷史、舊頁面用）

            // 讀現有的檔，保留歷史（每小時一筆，留 7 天）——之後拿來對時段、校正用
            const { owner, repo } = context.repo;
            const path = 'data/imm.json';
            let sha, hist = [], prevTpe = {};
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              sha = data.sha;
              const o = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              if (Array.isArray(o.hist)) hist = o.hist;
              if (o.tpe && typeof o.tpe === 'object') prevTpe = o.tpe;
            } catch (e) { core.info('沒有舊檔，從頭開始'); }

            // 順便存桃機官方每小時人數（今天），之後拿來跟移民署對時段、算比例。留 7 天。
            let tpe = {};
            try {
              const r = await fetch('https://www.taoyuanairport.com.tw/backend/adip/getPredictionOfFlightCapacityOnTheHour', {
                method: 'POST', signal: AbortSignal.timeout(30000),
                headers: { 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                           Origin: 'https://www.taoyuan-airport.com', Referer: 'https://www.taoyuan-airport.com/hfpv' },
                body: JSON.stringify({ date: stamp.slice(0, 10) }),
              });
              const j = r.ok ? await r.json() : null;
              const ds = j && j.data && j.data.dataset;
              if (Array.isArray(ds) && ds.length) {
                const o = {};
                for (const x of ds) {
                  const h = +String(x.hourStart || '').slice(0, 2); if (isNaN(h)) continue;
                  o[h] = [+x.t1ArrivalNum || 0, +x.t2ArrivalNum || 0, +x.t1DepartureNum || 0, +x.t2DepartureNum || 0,
                          +x.arrivalTransferNum || 0, +x.t1ArrivalTransferNum || 0];
                }
                tpe[stamp.slice(0, 10)] = o;
              }
            } catch (e) { core.info('桃機每小時人數這次抓不到：' + e.message); }

            const row = [stamp, cur.in2.total, cur.out2.total, cur.in1, cur.out1, cur.trans.total];
            const hour = stamp.slice(0, 13);
            hist = hist.filter(h => String(h[0]).slice(0, 13) !== hour).concat([row]).slice(-168);
            cur.hist = hist;
            const tpeAll = Object.assign({}, prevTpe, tpe);
            cur.tpe = {};
            Object.keys(tpeAll).sort().slice(-7).forEach(k => { cur.tpe[k] = tpeAll[k]; });

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha,
              message: `移民署人次 ${stamp}（第二航廈 入境 ${cur.in2.total}／出境 ${cur.out2.total}）`,
              content: Buffer.from(JSON.stringify(cur), 'utf8').toString('base64'),
            });
            core.info(`OK ${stamp}  T2入境=${cur.in2.total}  T2出境=${cur.out2.total}  過境=${cur.trans.total}`);
