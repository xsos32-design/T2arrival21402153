# 桃機到站看板 — 定時更新　檔案作者：小韋
name: 更新桃機到站看板

on:
  schedule:
    # 每 5 分鐘跑一次（GitHub 實際執行常有延遲，見 README 說明）
    - cron: '*/5 * * * *'
  # 讓你可以在 GitHub 網頁或 App 上手動按一下就更新
  workflow_dispatch:
  # 每次改程式碼推上來也重新產生一次
  push:
    branches: [main]

# 部署到 GitHub Pages 需要的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個，避免排程重疊
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 離峰時段（02:00-13:00）非整點那幾輪，build 會直接結束並輸出 skip=true，
      # 下面三步就整個跳過 —— 線上維持上一份，不會被空的 dist 蓋掉。
      - name: 抓桃機資料並產生靜態頁
        id: build
        run: node scripts/build.mjs
        env:
          TDX_ID: ${{ secrets.TDX_ID }}
          TDX_SECRET: ${{ secrets.TDX_SECRET }}
          # 推程式碼上來的那一次一定要重建，不然改了看不到
          FORCE_BUILD: ${{ github.event_name == 'push' && '1' || '0' }}

      - name: 設定 Pages
        if: steps.build.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: 上傳產出
        if: steps.build.outputs.skip != 'true'
        with:
          path: dist
        uses: actions/upload-pages-artifact@v3

      - name: 部署到 GitHub Pages
        if: steps.build.outputs.skip != 'true'
        id: deploy
        uses: actions/deploy-pages@v4
